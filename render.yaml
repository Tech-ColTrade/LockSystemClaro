# Blueprint de Render — https://render.com/docs/blueprint-spec
#
# Define los dos servicios por separado:
#   lockingsystem-api  -> Django + Gunicorn + Chromium (Docker)
#   lockingsystem-web  -> build de Vite servido como sitio estático
#
# La base de datos NO se declara aquí a propósito: ya existe una instancia de
# PostgreSQL creada a mano en Render. Declararla haría que el blueprint intente
# aprovisionar otra. Su cadena de conexión se inyecta como DATABASE_URL.
#
# Todo `sync: false` significa: el valor se define a mano en el dashboard y
# nunca se versiona. Ahí van todos los secretos.

services:
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: lockingsystem-api
    runtime: docker
    # Misma región que la base de datos: permite usar la Internal Database URL,
    # que no sale a internet y no consume ancho de banda facturable.
    region: oregon
    plan: standard # Chromium necesita ~400 MB; con 512 MB el servicio hace OOM.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"

      # Render genera una clave aleatoria fuerte la primera vez.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true

      # Cadena de conexión de PostgreSQL (usa la Internal Database URL).
      - key: DATABASE_URL
        sync: false

      # La instancia de Postgres la comparte la app antigua (whaletv), que vive
      # en el esquema `public`. Esta app usa el suyo para no pisarla. El esquema
      # debe existir antes del primer deploy:
      #   CREATE SCHEMA IF NOT EXISTS "LockClaro";
      - key: DB_SCHEMA
        value: LockClaro

      # Origen del frontend, para la allowlist de CORS.
      # Ej: https://lockingsystem-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

      # Base pública del frontend. Con ella se arma el enlace del correo de
      # recuperación de contraseña; si apunta a otro sitio, el enlace lleva a
      # una página que no existe. Ej: https://lockingsystem-web.onrender.com
      - key: FRONTEND_URL
        sync: false

      # Minutos de inactividad tras los que se cierra la sesión. De ella se
      # derivan las vidas de los tokens JWT, así que el corte lo impone el
      # servidor y no solo el navegador.
      - key: SESSION_INACTIVITY_MINUTOS
        value: "15"

      # Correo saliente (Gmail con OAuth2). Sin estas cuatro el arranque falla
      # adrede: la recuperación de contraseña no podría enviar nada.
      # El refresh token debe tener el scope gmail.send.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM
        sync: false

      # Secretos de integración WhaleTV. Sin ellos el arranque falla adrede
      # (guard en settings.py con DEBUG=False).
      - key: WHALETV_LOCK_API_ACCESS_KEY
        sync: false
      - key: WHALETV_LOCK_API_SECRET_KEY
        sync: false
      - key: WHALETV_PORTAL_EMAIL
        sync: false
      - key: WHALETV_PORTAL_PASSWORD
        sync: false
      # URLs del portal por entorno (ACC/PROD); si se omiten se usa el host
      # por defecto lockservice.whaletv.com.
      - key: WHALETV_PORTAL_LOGIN_URL
        sync: false
      - key: WHALETV_PORTAL_DEVICE_LIST_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: lockingsystem-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # URL del backend, SIN `/api` al final (src/lib/config.ts ya lo añade).
      # Definida aquí, gana sobre el valor de frontend/.env.production.
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router usa rutas del lado del cliente: cualquier URL que no sea un
      # fichero real debe devolver index.html, o recargar /login daría un 404.
      - type: rewrite
        source: /*
        destination: /index.html
